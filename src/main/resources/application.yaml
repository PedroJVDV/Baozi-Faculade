server:
  port: 8082

spring:
  application:
    name: baozistore

  datasource:
    url: jdbc:h2:mem:baozidb;
    driver-class-name: org.h2.Driver
    username: root
    password: 123456

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true